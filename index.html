<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Controlled Particles</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; }
        canvas { display: block; }
        
        #ui-container {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        #instructions {
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #status {
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Hide the raw video feed, we only want the detection data */
        .input_video { display: none; }

        /* Small preview to show the user where their hand is detected */
        #preview-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
            background: rgba(0,0,0,0.5);
        }

        #preview-canvas {
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Mirror the preview */
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div id="instructions">WAVE HAND TO CONTROL GALAXY</div>
        <div id="status">Initializing Camera...</div>
    </div>

    <div id="preview-container">
        <canvas id="preview-canvas" width="320" height="240"></canvas>
    </div>

    <video class="input_video"></video>
    
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // --- GLOBAL VARIABLES FOR HAND TRACKING ---
        // We will update these from MediaPipe and read them in Three.js
        let handX = 0;
        let handY = 0;
        let isHandDetected = false;

        // --- PART 1: THREE.JS SETUP (VISUALS) ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 100;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Particle System
        const particleCount = 15000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const colorObj = new THREE.Color();

        for (let i = 0; i < particleCount; i++) {
            const x = (Math.random() - 0.5) * 200;
            const y = (Math.random() - 0.5) * 200;
            const z = (Math.random() - 0.5) * 200;

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            colorObj.setHSL(Math.random() * 0.2 + 0.5, 0.7, 0.5);
            colors[i * 3] = colorObj.r;
            colors[i * 3 + 1] = colorObj.g;
            colors[i * 3 + 2] = colorObj.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png');
        const material = new THREE.PointsMaterial({
            size: 0.8,
            vertexColors: true,
            map: sprite,
            alphaTest: 0.5,
            transparent: true,
            opacity: 0.8
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- PART 2: MEDIAPIPE SETUP (HAND TRACKING) ---
        const videoElement = document.getElementsByClassName('input_video')[0];
        const previewCanvas = document.getElementById('preview-canvas');
        const previewCtx = previewCanvas.getContext('2d');
        const statusText = document.getElementById('status');

        function onResults(results) {
            // Draw the preview window
            previewCtx.save();
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            previewCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandDetected = true;
                statusText.innerText = "Hand Detected";
                statusText.style.color = "#00ff88";

                // Get the first hand detected
                const landmarks = results.multiHandLandmarks[0];
                
                // Draw skeleton on preview
                drawConnectors(previewCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
                
                // Get Index Finger Tip (Landmark 8) coordinates (0.0 to 1.0)
                // MediaPipe coordinates: 0 is left/top, 1 is right/bottom
                const x = landmarks[8].x; 
                const y = landmarks[8].y;

                // Map 0..1 to -100..100 (approximately) for Three.js control
                // We reverse X because webcam is mirrored in our mind (moving hand right should move scene right)
                handX = (0.5 - x) * 2000; 
                handY = (0.5 - y) * 2000;

            } else {
                isHandDetected = false;
                statusText.innerText = "Searching for hand...";
                statusText.style.color = "orange";
            }
            previewCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 320,
            height: 240
        });
        cameraUtils.start();


        // --- PART 3: ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // Interaction Logic
            // If hand is detected, rotate towards hand position. 
            // If not, auto-rotate slowly.
            
            if (isHandDetected) {
                particles.rotation.y += 0.05 * (handX * 0.001 - particles.rotation.y);
                particles.rotation.x += 0.05 * (handY * 0.001 - particles.rotation.x);
            } else {
                // Idle animation
                particles.rotation.y += 0.001;
            }

            const positions = particles.geometry.attributes.position.array;
            const colors = particles.geometry.attributes.color.array;

            for (let i = 0; i < particleCount; i++) {
                const x = positions[i * 3];
                const z = positions[i * 3 + 2];
                
                // Wave Animation
                positions[i * 3 + 1] = Math.sin((x + time * 10) * 0.05) * 10 + Math.cos((z + time * 5) * 0.05) * 5;

                // Color Interaction
                // If hand is detected, shift color based on hand X position
                if (isHandDetected) {
                    const vx = (x / 200) + 0.5;
                    // Use handX to drive the hue
                    const hueShift = (handX / 1000) + 0.5; 
                    colorObj.setHSL(hueShift + vx * 0.1, 0.8, 0.6);
                    
                    colors[i * 3] = colorObj.r;
                    colors[i * 3 + 1] = colorObj.g;
                    colors[i * 3 + 2] = colorObj.b;
                }
            }

            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.color.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        // Handle Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
